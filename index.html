<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>body{margin:0}img{max-width:100%}</style></head><body>
<title>숨은 기준 스위치</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;700&display=swap">
<style>
/* Layout: 한 화면 무대 — 위 상태줄, 가운데 장면 카드 한 장. 학교급마다 색과 글꼴만 바뀌고 규칙은 같다. */
:root{
  --bg:#F3F6EE; --card:#FFFFFF; --paper2:#FFF6E3; --ink:#1F3A3D; --muted:#5B6E6C; --line:#C9D6CE;
  --a:#F29E38; --onA:#1F3A3D; --b:#2F9C95; --b2:#B4561B; --soft:#DFF1EC;
  --display:'Jua','Gowun Dodum',system-ui,sans-serif; --body:'Gowun Dodum',system-ui,sans-serif;
  --radius:18px; color-scheme:light;
}
body.e1{
  --bg:#FBF3E6; --paper2:#FFF0D6; --ink:#3A2E22; --muted:#76654F; --line:#E2D2B8;
  --a:#7FC37A; --onA:#23361F; --b:#E07A3F; --b2:#B4561B; --soft:#EAF5E3;
}
body.e3{
  --bg:#EFF4FA; --paper2:#E8F1FB; --ink:#22364A; --muted:#5A6B7D; --line:#C9D6E4;
  --a:#F5B83D; --onA:#22364A; --b:#3E8ACC; --b2:#B4561B; --soft:#E1EDF8;
}
body.par{
  --bg:#F1F0EA; --paper2:#F6F2E6; --ink:#2E3A2F; --muted:#5F6A5E; --line:#CFD3C6;
  --a:#E9A86B; --onA:#2E3A2F; --b:#5E8C61; --b2:#B0402E; --soft:#E7EDE2;
}
body.staff{
  --bg:#EDF1F1; --paper2:#EAF2F1; --ink:#203A3F; --muted:#56696C; --line:#C5D3D3;
  --a:#9CC6B9; --onA:#203A3F; --b:#3F7F86; --b2:#B0402E; --soft:#E0ECEA;
}
body.adult{--display:'Do Hyeon','IBM Plex Sans KR',system-ui,sans-serif; --body:'IBM Plex Sans KR',system-ui,sans-serif}
body.mid{
  --bg:#EEF0F5; --paper2:#F0F3FB; --ink:#232A44; --muted:#5D6480; --line:#C8CDDD;
  --a:#E8C547; --onA:#232A44; --b:#5468C8; --b2:#B0402E; --soft:#E6E9F7;
  --display:'Do Hyeon','IBM Plex Sans KR',system-ui,sans-serif; --body:'IBM Plex Sans KR',system-ui,sans-serif;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6;padding-inline:16px;display:flex;flex-direction:column}
body.big{font-size:21px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible,.ch:focus-visible{outline:3px solid var(--b);outline-offset:3px}
.top{position:relative;z-index:6;background:var(--bg);display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding-block:14px;border-bottom:2px dashed var(--line)}
.brand{font-family:var(--display);font-size:1.5em;line-height:1.1;margin-right:auto}
.brand small{display:block;font-family:var(--body);font-size:.5em;color:var(--muted);letter-spacing:.06em}
.stat{font-variant-numeric:tabular-nums;font-size:.9em;color:var(--muted)}
.stat b{color:var(--ink);font-size:1.15em}
.tool{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:4px 14px;font-size:.9em}
.tool[aria-pressed="true"]{background:var(--ink);color:var(--card);border-color:var(--ink)}
main{flex:1;display:flex;align-items:flex-start;justify-content:center;padding-block:22px 28px}
.stage{width:100%;max-width:820px;display:flex;flex-direction:column;gap:18px}
.tag{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:.85em;letter-spacing:.04em;color:var(--muted)}
.tag .lv{background:var(--soft);color:var(--ink);border-radius:999px;padding:2px 12px}
.dots{display:flex;gap:6px}
.dots i{width:22px;height:8px;border-radius:4px;background:var(--line)}
.dots i.d{background:var(--a)}
.dots i.now{background:var(--ink)}
.scene{background:var(--card);border:2px solid var(--ink);border-radius:var(--radius);padding:26px 26px 22px;box-shadow:6px 6px 0 var(--ink);display:flex;flex-direction:column;gap:16px;min-width:0}
.sent{font-family:var(--display);font-size:1.75em;line-height:1.55;margin:0;word-break:keep-all}
.ch{border-radius:8px;padding:0 2px;transition:background .2s}
.ch.chg{text-decoration:underline wavy var(--b);text-underline-offset:6px;text-decoration-thickness:2px}
.armed .ch{cursor:pointer;box-shadow:inset 0 -0.45em 0 var(--soft)}
.armed .ch:hover{background:var(--soft)}
.ch.key{background:var(--a);color:var(--onA);box-shadow:none}
.ch.no{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.switch{align-self:flex-start;display:flex;align-items:center;gap:12px;background:none;border:0;padding:0}
.track{width:72px;height:38px;border-radius:999px;background:var(--b);position:relative;border:2px solid var(--ink);flex:none}
.knob{position:absolute;top:3px;left:3px;width:28px;height:28px;border-radius:50%;background:var(--card);border:2px solid var(--ink);transition:left .25s;display:grid;place-items:center;font-size:15px;line-height:1}
.on .track{background:var(--a)}
.on .knob{left:37px}
.switch .lbl{font-weight:700}
.guide{margin:0;color:var(--muted)}
.msg{margin:0;font-weight:700;color:var(--b2);min-height:1.6em}
.std{background:var(--paper2);border:2px dashed var(--ink);border-radius:var(--radius);padding:18px 22px;display:flex;flex-direction:column;gap:6px;position:relative}
.std .k{font-size:.85em;letter-spacing:.08em;color:var(--muted)}
.std .v{font-family:var(--display);font-size:1.6em;line-height:1.3;word-break:keep-all}
.stamp{position:absolute;right:16px;top:-14px;background:var(--a);color:var(--onA);border:2px solid var(--ink);border-radius:999px;padding:2px 12px;font-weight:700;transform:rotate(4deg);font-variant-numeric:tabular-nums}
.ask{font-weight:700;margin:4px 0 0}
.opts{display:grid;gap:10px}
.opt{text-align:left;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px 16px;display:flex;gap:12px;align-items:flex-start}
.opt:hover{border-color:var(--ink)}
.opt .box{flex:none;width:24px;height:24px;border:2px solid var(--ink);border-radius:6px;display:grid;place-items:center;margin-top:2px;font-weight:700}
.opt[aria-pressed="true"]{border-color:var(--ink);background:var(--soft)}
.opt[aria-pressed="true"] .box::after{content:"✓"}
.note{margin:0;padding:12px 16px;border-left:5px solid var(--b);background:var(--paper2);border-radius:0 12px 12px 0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:4px 14px;font-size:.92em}
.chip:hover{border-color:var(--ink)}
textarea{box-sizing:border-box;width:100%;min-height:76px;font:inherit;border:2px solid var(--line);border-radius:12px;padding:10px 14px;background:var(--card);color:var(--ink);resize:vertical}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.go{background:var(--ink);color:var(--card);border:2px solid var(--ink);border-radius:999px;padding:10px 26px;font-weight:700}
.go.ghost{background:var(--card);color:var(--ink)}
.go:disabled{opacity:.35;cursor:not-allowed}
.splash{position:fixed;inset:0;padding-top:96px!important;background:var(--bg);display:grid;place-items:center;padding:24px;z-index:5;text-align:center;overflow:auto}
.splash .inner{display:flex;flex-direction:column;gap:14px;align-items:center;max-width:580px}
.splash .num{font-family:var(--display);font-size:1.1em;color:var(--muted);letter-spacing:.1em}
.splash h2{font-family:var(--display);font-size:2.4em;margin:0;line-height:1.2;text-wrap:balance}
.splash p{margin:0;color:var(--muted)}
.pick{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;width:100%}
.pick button{background:var(--card);border:2px solid var(--ink);border-radius:var(--radius);box-shadow:5px 5px 0 var(--ink);padding:20px;display:flex;flex-direction:column;gap:4px;align-items:center}
.pick b{font-family:var(--display);font-size:1.6em;font-weight:400;word-break:keep-all;white-space:nowrap}
.pick span{color:var(--muted);font-size:.9em}
.pick .e b{font-family:'Jua',system-ui,sans-serif}
.pick .m b{font-family:'Do Hyeon',system-ui,sans-serif}
.how{margin:0;padding:0;list-style:none;display:grid;gap:6px;text-align:left}
.how li{display:flex;gap:10px}
.how li span{flex:none;width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--card);display:grid;place-items:center;font-size:.85em;font-weight:700}
.dex{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.dex div{border:2px solid var(--ink);border-radius:14px;padding:10px 14px;background:var(--paper2);min-width:0;word-break:keep-all}
.dex small{display:block;color:var(--muted);font-size:.8em}
.dex em{display:block;font-style:normal;color:var(--muted);font-size:.9em;margin-top:4px}
h2.t{font-family:var(--display);font-size:2em;margin:0;line-height:1.2}
.list{margin:0;padding-left:1.2em;display:grid;gap:6px}
.piece{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-left:auto}
.piece .lbl2{font-size:.85em;color:var(--muted)}
.tiles{display:flex;gap:4px}
.tiles i{font-style:normal;width:1.9em;height:1.9em;display:grid;place-items:center;border:2px solid var(--ink);border-radius:8px;background:var(--card);font-family:var(--display);font-size:1.05em}
.tiles i.on{background:var(--a);color:var(--onA)}
.tiles i.pop{animation:pop .5s}
@keyframes pop{40%{transform:scale(1.25)}}
.card{background:var(--card);border:3px solid var(--ink);border-radius:22px;padding:24px;display:flex;flex-direction:column;gap:16px;box-shadow:6px 6px 0 var(--ink);text-align:center;align-items:center}
.card .eyebrow{font-size:.85em;letter-spacing:.12em;color:var(--muted)}
.card h2{font-family:var(--display);font-size:1.9em;margin:0;line-height:1.2}
.phrase{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;width:100%}
.phrase div{flex:1 1 120px;max-width:180px;border:2px dashed var(--line);border-radius:14px;padding:10px 6px;display:flex;flex-direction:column;gap:2px;min-width:0}
.phrase div b{font-family:var(--display);font-weight:400;font-size:1.35em;color:var(--line);word-break:keep-all}
.phrase div small{color:var(--muted);font-size:.78em}
.phrase div.mine{border:3px solid var(--ink);background:var(--a)}
.phrase div.mine b{color:var(--onA)}
.phrase div.mine small{color:var(--onA)}
.mysay{margin:0;padding:12px 16px;background:var(--paper2);border-radius:12px;width:100%;word-break:keep-all}
.mysay small{display:block;color:var(--muted);font-size:.8em}
.code{font-variant-numeric:tabular-nums;font-size:.85em;color:var(--muted);letter-spacing:.05em}
.pick{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.field{box-sizing:border-box;flex:1 1 160px;min-width:0;font:inherit;border:2px solid var(--line);border-radius:12px;padding:10px 14px;background:var(--card);color:var(--ink)}
.sel{flex:1 1 30%;min-width:0;padding-right:8px;appearance:auto}
.field:focus-visible,#cAgree:focus-visible{outline:3px solid var(--b);outline-offset:2px}
a.go{display:inline-block;text-align:center;text-decoration:none;align-self:flex-start}
a.go[aria-disabled="true"]{opacity:.35;cursor:not-allowed}
.opt.trap{border-style:dashed;opacity:.75}
.opt.trap .box::after{content:"✕"}
.trapTag{display:inline-block;margin-left:6px;font-size:.78em;padding:0 8px;border-radius:999px;background:var(--b2);color:var(--card)}
.note.warn{border-left-color:var(--b2)}
.info{max-width:680px;width:100%;text-align:left;display:flex;flex-direction:column;gap:18px;padding-block:8px 24px}
.info h3{font-family:var(--display);font-size:1.25em;margin:0 0 6px;font-weight:400}
.info p{margin:0;color:var(--ink)}
.info section{background:var(--card);border:2px solid var(--ink);border-radius:16px;padding:16px 18px;display:flex;flex-direction:column;gap:8px}
.info .def{font-family:var(--display);font-size:1.15em;background:var(--paper2);border-radius:10px;padding:10px 14px}
.pair{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:center;border-top:1px dashed var(--line);padding-top:8px}
.pair span{min-width:0;word-break:keep-all}
.pair .to{color:var(--muted);font-weight:700}
.pair .b{background:var(--paper2);border-radius:8px;padding:4px 8px}
.pair small{grid-column:1/-1;color:var(--muted);font-size:.85em}
.info a{color:var(--b);font-weight:700;word-break:break-all}
.infoCard{width:100%;display:flex;flex-direction:column;gap:2px;align-items:flex-start;text-align:left;background:#2E4057;color:#FFFFFF;border:0;border-radius:16px;padding:14px 18px;box-shadow:4px 4px 0 #F2B04B}
.infoCard b{font-family:var(--display);font-weight:400;font-size:1.3em}
.infoCard span{font-size:.9em;color:#DDE6F0}
.infoCard:focus-visible{outline:3px solid #F2B04B;outline-offset:3px}
.infoBtn{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:.9em;padding:6px}
.foot{font-size:.8em;color:var(--muted);padding-block:10px 16px;text-align:center}
@media (max-width:560px){
  .top{gap:6px 10px;padding-block:10px}
  .brand small{font-size:.55em}
  .tool{padding:2px 10px;font-size:.78em}
  .stat{font-size:.82em}
  main{padding-block:12px 20px}
  .stage{gap:10px}
  .tag .area{display:none}
  .dots i{width:14px;height:6px}
  .tiles i{width:1.7em;height:1.7em;font-size:.95em}
  .pick{grid-template-columns:1fr 1fr;gap:10px}
  .pick button{padding:12px 8px;box-shadow:3px 3px 0 var(--ink)}
  .pick b{font-size:1.2em}
  .pick span{font-size:.78em}
  .splash .inner{gap:10px}
  .how{font-size:.92em}
  .std{padding:14px 16px}
  .std .v{font-size:1.35em}
  .sent{font-size:1.4em}.scene{padding:20px 18px;box-shadow:4px 4px 0 var(--ink)}.brand{font-size:1.25em}.splash h2{font-size:1.9em}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<header class="top">
  <div class="brand">숨은 기준 스위치<small id="sub">바꿔 보고, 찾고, 이어 보기</small></div>
  <span class="stat">장면 <b id="sProg">-</b></span>
  <span class="stat">점수 <b id="sScore">0</b></span>
  <button class="tool" id="bGoHome" type="button">처음으로</button>
  <button class="tool" id="bRead" type="button">읽어 주기</button>
  <button class="tool" id="bBig" type="button" aria-pressed="false">글자 크게</button>
</header>
<main><div class="stage" id="stage"></div></main>
<div class="splash" id="splash" hidden><div class="inner" id="splashIn"></div></div>
<p class="foot">인천청호초·중학교 · 평등탐험 보물찾기 RUN · 자유롭게 고쳐 쓰고 나눌 수 있는 교육 자료</p>

function start(g){
  grade=g; G=BANK[g];
  document.body.classList.remove(...GRADES,'adult'); document.body.classList.add(g); if(ADULT.includes(g)) document.body.classList.add('adult');
  $('#sub').textContent=G.label;
  // 남녀 사례가 번갈아 고르게 나오도록 뽑기
  const order=[], cnt={m:0,f:0};
  G.levels.forEach((_,n)=>{
    const pool=shuffle(G.scenes.filter(d=>d.lv===n+1)), k=Array.isArray(G.perLevel)?G.perLevel[n]:G.perLevel;
    for(let j=0;j<k&&pool.length;j++){
      const need=cnt.m===cnt.f?(Math.random()<.5?'m':'f'):(cnt.m<cnt.f?'m':'f');
      let i=pool.findIndex(d=>d.g===need); if(i<0) i=pool.findIndex(d=>d.g==='b'); if(i<0) i=0;
      const d=pool.splice(i,1)[0]; if(d.g in cnt) cnt[d.g]++; order.push(d);
    }
  });
  S={order,i:0,phase:'find',flipped:false,ever:false,tries:0,score:0,lose:{},write:{},msg:'',gain:0,pop:false,
     code:Math.random().toString(36).slice(2,6).toUpperCase(),scr:scramble(pieceChars(g)),pz:[],pzTries:0,pzSelf:true};
  G.together ? showTogether() : showLevel(1);
}
const cur=()=>S.order[S.i];

function showTogether(){

    <li><span>3</span>"나라면 이렇게 말할래"는 아이가 말하고 보호자가 대신 써 줘도 좋아요.</li>

function showLevel(lv){

function stats(){
  $('#sProg').textContent=`${Math.min(S.i+1,S.order.length)}/${S.order.length}`;
  $('#sScore').textContent=S.score;
}
function revealed(){ // 몇 글자가 열렸나: 찾은 장면 수에 비례
  const done=S.i+(S.phase==='find'?0:1), n=pieceChars(grade).length;
  return Math.min(n,Math.ceil(done*n/S.order.length));
}
function tilesHTML(){
  const ch=S.scr, r=revealed();
  return `<span class="piece"><span class="lbl2">섞인 보물 글자</span><span class="tiles">${ch.map((c,i)=>`<i class="${i<r?'on':''}${S.pop&&i<r&&i>=S.prevR?' pop':''}">${i<r?esc(c):'?'}</i>`).join('')}</span></span>`;
}

function sentHTML(d,armed){
  return `<p class="sent ${armed?'armed':''}" id="sent">${norm(d.s).map((c,i)=>{
    const txt=S.flipped?c.f:c.o, chg=c.o!==c.f;
    const key=(S.phase!=='find'&&c.k)?' key':'';
    return `<span class="ch${chg&&S.ever&&S.phase==='find'?' chg':''}${key}" data-i="${i}" ${armed?'role="button" tabindex="0"':''}>${esc(txt)}</span>`;
  }).join('')}</p>`;
}

function render(){
  stats();
  const d=cur(), L=G.levels[d.lv-1];
  const dots=`<span class="dots" aria-hidden="true">${S.order.map((_,n)=>`<i class="${n<S.i?'d':n===S.i?'now':''}"></i>`).join('')}</span>`;
  let h=`<div class="tag">${dots}<span class="lv">${G.levels.length>1?d.lv+'단계 · ':''}${esc(L.name)}</span><span class="area">${esc(d.area)}</span>${tilesHTML()}</div><section class="scene">`;
  S.pop=false;
  if(S.phase==='find'){
    h+=sentHTML(d,S.ever);
    h+=`<button class="switch ${S.flipped?'on':''}" id="bFlip" type="button" aria-pressed="${S.flipped}"><span class="track"><span class="knob">⇄</span></span><span class="lbl">${S.flipped?'원래대로 돌리기':'성별 바꿔 보기'}</span></button>`;
    h+=`<p class="guide">${S.ever?'바꿔 읽으니 어색하게 들리는 말이 있나요? 그 말을 눌러 보세요.':'스위치를 눌러 이야기 속 성별을 바꿔 보세요.'}</p>`;
    h+=`<p class="msg" id="msg" aria-live="polite">${esc(S.msg)}</p>`;
  } else {
    h+=sentHTML(d,false);
    h+=`<div class="std"><span class="stamp">+${S.gain}</span><span class="k">당연하게 여겨진 것</span><span class="v">${esc(d.std)}</span></div>`;
    h+=stepHTML(d);
  }
  h+=`</section>`;
  $('#stage').innerHTML=h;
  bind(d);
}

function stepHTML(d){
  const last=S.i===S.order.length-1, nextLbl=last?'마지막 수수께끼로':'다음 장면';
  if(S.phase==='lose'){
    const sel=S.lose[d.id]||[], done=S.lose[d.id+'_ok'], out=S.lose[d.id+'_out']||[];
    const ord=S.lose[d.id+'_ord']||(S.lose[d.id+'_ord']=shuffle([...d.lose.map((_,i)=>i),...(d.trap?['T']:[])]));
    const txt=k=>k==='T'?d.trap.t:d.lose[k];
    let h=`<p class="ask">이 생각 때문에 손해 보는 사람을 모두 골라요.${d.trap?' 함정이 하나 숨어 있어요!':''}</p>
    <div class="opts">${ord.map(k=>{
      const isOut=out.includes(k), trapShown=done&&k==='T';
      const pressed=!isOut&&!trapShown&&(done?k!=='T':sel.includes(k));
      return `<button type="button" class="opt${isOut||trapShown?' trap':''}" data-lose="${k}" aria-pressed="${pressed}" ${done||isOut?'disabled':''}><span class="box"></span><span>${esc(txt(k))}${isOut||trapShown?' <b class="trapTag">함정</b>':''}</span></button>`;}).join('')}</div>`;
    if(S.trapMsg) h+=`<p class="note warn">${esc(S.trapMsg)}</p>`;
    if(done){
      const missed=d.lose.length-sel.filter(k=>k!=='T').length;
      h+=`<p class="note">${missed?`놓친 것도 있었어요. 체크된 ${d.lose.length}가지가 모두 손해예요.`:'손해 보는 사람을 모두 찾았어요!'} 이 생각은 한쪽 성별만 묶지 않아요.</p><div class="row"><button class="go" id="bToWrite" type="button">다음</button></div>`;
    } else h+=`<div class="row"><button class="go" id="bCheck" type="button" ${sel.length?'':'disabled'}>확인</button></div>`;
    return h;
  }
  if(S.phase==='write'){
    const w=G.write;
    if(w.pickOnly){
      const p=S.write[d.id];
      return `<p class="ask">${esc(w.ask)}</p><div class="opts">${d.say.map((t,i)=>`<button type="button" class="opt" data-pick="${i}" aria-pressed="${p===t}"><span class="box"></span><span>${esc(t)}</span></button>`).join('')}</div>
      <p class="guide">${esc(w.note)}</p>
      <div class="row"><button class="go" id="bNext" type="button" ${p?'':'disabled'}>${nextLbl}</button></div>`;
    }
    return `<p class="ask">${esc(w.ask)}</p>
    ${d.say?`<div class="chips">${d.say.map((t,i)=>`<button type="button" class="chip" data-chip="${i}">${esc(t)}</button>`).join('')}</div>`:''}
    <textarea id="tWrite" placeholder="${esc(w.ph)}">${esc(S.write[d.id]||'')}</textarea>
    <p class="guide">${esc(w.note)}</p>
    <p class="msg" id="wMsg" aria-live="polite"></p>
    <div class="row"><button class="go" id="bNext" type="button" disabled>${nextLbl}</button></div>`;
  }
  return '';
}

function focusOn(sel,block){ requestAnimationFrame(()=>{ const el=document.querySelector(sel); if(el) el.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth',block:block||'start'}); }); }
function afterFind(){ return G.steps[0]; }
function bind(d){
  const f=$('#bFlip');
  if(f) f.onclick=()=>{S.flipped=!S.flipped;S.ever=true;S.msg='';render();};
  document.querySelectorAll('.armed .ch').forEach(el=>{
    const go=()=>tap(d,+el.dataset.i,el);
    el.onclick=go; el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go();}};
  });
  document.querySelectorAll('[data-lose]').forEach(b=>b.onclick=()=>{
    const k=b.dataset.lose==='T'?'T':+b.dataset.lose, a=S.lose[d.id]||(S.lose[d.id]=[]);
    a.includes(k)?a.splice(a.indexOf(k),1):a.push(k); S.trapMsg=''; render();
  });
  document.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{S.write[d.id]=d.say[+b.dataset.pick];render();});
  const c=$('#bCheck'); if(c) c.onclick=()=>{
    const a=S.lose[d.id]||[];
    if(a.includes('T')){
      a.splice(a.indexOf('T'),1); (S.lose[d.id+'_out']||(S.lose[d.id+'_out']=[])).push('T');
      S.trapMsg=`잠깐! 다시 생각해 볼까요? ${d.trap.why}`; render(); focusOn('.note.warn','center'); return;
    }
    S.lose[d.id+'_ok']=true;
    if(!(S.lose[d.id+'_out']||[]).length && a.length===d.lose.length) S.score+=50;
    S.trapMsg=''; render(); focusOn('#bToWrite','center');
  };
  const tw=$('#bToWrite'); if(tw) tw.onclick=()=>{S.phase='write';render();focusOn('.std');};
  const tW=$('#tWrite');
  if(tW){
    const chk=()=>{
      const v=tW.value.trim(), ex=(d.say||[]).includes(v);
      $('#bNext').disabled = v.length<2 || ex;
      $('#wMsg').textContent = ex ? '예시 그대로예요. 한 단어라도 내 말로 바꿔 써 보세요.' : '';
    };
    tW.addEventListener('input',chk); chk();
    document.querySelectorAll('[data-chip]').forEach(b=>b.onclick=()=>{tW.value=d.say[+b.dataset.chip];chk();tW.focus();});
  }
  const n=$('#bNext'); if(n) n.onclick=()=>{
    const t=$('#tWrite');
    if(t){ const v=t.value.trim(); S.write[d.id]=v; if(v && !(d.say||[]).includes(v)) S.score+=50; }
    next();
  };
}

function tap(d,i,el){
  const c=norm(d.s)[i];
  if(c.k){
    S.prevR=revealed();
    S.gain=S.tries===0?100:50; S.score+=S.gain;
    S.phase=afterFind(); S.flipped=false; S.pop=true; render(); focusOn('.std'); return;
  }
  S.tries++;
  el.classList.remove('no'); void el.offsetWidth; el.classList.add('no');
  S.msg = c.o!==c.f ? '이름만 바뀌었어요. 이야기 속 다른 말은 어떤가요?'
        : S.tries>=2 ? '힌트: 누군가 한 말(따옴표 안)을 바꿔 읽어 보세요.'
        : '이 부분은 성별을 바꿔도 그대로예요. 다른 곳을 찾아볼까요?';
  $('#msg').textContent=S.msg;
}

function next(){
  const prevLv=cur().lv;
  S.i++; S.phase='find'; S.flipped=false; S.ever=false; S.tries=0; S.msg='';
  if(S.i>=S.order.length){puzzle();return;}
  window.scrollTo(0,0);
  cur().lv!==prevLv ? showLevel(cur().lv) : render();
}

function puzzle(){
  $('#sProg').textContent=`${S.order.length}/${S.order.length}`; $('#sScore').textContent=S.score;
  const ans=pieceChars(grade), used=S.pz;
  const left=S.scr.map((c,i)=>({c,i})).filter(o=>!used.includes(o.i));
  const hint=S.pzTries>=2?`힌트: 첫 글자는 '${ans[0]}'예요.`:'';
  $('#stage').innerHTML=`<section class="scene" style="align-items:center;text-align:center">
    <span class="tag">마지막 수수께끼</span>
    <h2 class="t" style="font-size:1.6em">섞인 글자를 바른 순서로 맞춰 보세요</h2>
    <p class="guide">장면을 풀며 모은 글자예요. 순서대로 누르면 아래 칸에 들어가요.</p>
    <div class="tiles" style="font-size:1.4em;min-height:2.2em" aria-label="내가 맞춘 순서">${ans.map((_,k)=>`<i class="${used[k]!==undefined?'on':''}">${used[k]!==undefined?esc(S.scr[used[k]]):''}</i>`).join('')}</div>
    <div class="row" style="justify-content:center">${left.map(o=>`<button type="button" class="chip" style="font-size:1.4em;font-family:var(--display);min-width:2.2em" data-pz="${o.i}">${esc(o.c)}</button>`).join('')}</div>
    <p class="msg" id="pzMsg" aria-live="polite">${esc(S.pzMsg||hint)}</p>
    <div class="row" style="justify-content:center">
      <button class="go ghost" id="bUndo" type="button" ${used.length?'':'disabled'}>한 글자 지우기</button>
      ${S.pzTries>=4?'<button class="go ghost" id="bReveal" type="button">정답 보기</button>':''}
    </div></section>`;
  window.scrollTo(0,0);
  document.querySelectorAll('[data-pz]').forEach(b=>b.onclick=()=>{
    S.pz.push(+b.dataset.pz); S.pzMsg='';
    if(S.pz.length===ans.length){
      if(S.pz.map(i=>S.scr[i]).join('')===ans.join('')){ S.score+=S.pzSelf?100:0; end(); return; }
      S.pzTries++; S.pz=[]; S.pzMsg='순서가 조금 달라요. 다시 해 볼까요?'+(S.pzTries>=2?` 첫 글자는 '${ans[0]}'예요.`:'');
    }
    puzzle();
  });
  $('#bUndo').onclick=()=>{S.pz.pop();S.pzMsg='';puzzle();};
  const rv=$('#bReveal'); if(rv) rv.onclick=()=>{S.pzSelf=false;end();};
}

function end(){
  S.done=true;
  $('#sProg').textContent=`${S.order.length}/${S.order.length}`; $('#sScore').textContent=S.score;
  const ws=S.order.filter(d=>S.write[d.id]);
  const pick=ws.length?ws[ws.length-1]:null;
  const now=new Date(), stamp=`${now.getMonth()+1}월 ${now.getDate()}일 ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
  const myIdx=ORDER.indexOf(grade);
  let h=`<section class="card" id="card">
    <span class="eyebrow">평등탐험 보물찾기 RUN · 보물 조각 카드</span>
    <h2>${S.pzSelf?'수수께끼를 풀었어요!':esc(G.label)+' 조각을 찾았어요!'}</h2>
    <div class="phrase">${ORDER.map((g,i)=>`<div class="${i===myIdx?'mine':''}"><small>${esc(BANK[g].label)}</small><b>${i===myIdx?esc(BANK[g].piece):'? ? ?'}</b></div>`).join('')}</div>
    <p class="guide">여섯 조각을 순서대로 이으면 문장 하나가 완성돼요. 가족, 선생님, 다른 학년 친구에게 조각을 물어보세요!</p>
    ${pick?`<p class="mysay"><small>${esc(G.write.tag)}</small>${esc(S.write[pick.id])}</p>`:''}
    <span class="code">찾은 기준 ${S.order.length}개 · 점수 ${S.score}점 · ${stamp} · 확인 번호 ${S.code}</span>
  </section>
  <p class="note">${esc(G.endAsk)}</p>
  <section class="scene" id="send">
    <h2 class="t" style="font-size:1.5em">${grade==='par'?'가족 보드게임 추첨에 응모하기':'선물 추첨에 응모하기'}</h2>
    ${grade==='par'?'<p class="guide">당첨된 가정에는 가족이 함께할 수 있는 보드게임을 자녀 편으로 보내 드려요.</p>':''}
    <p class="guide">${grade==='staff'?'소속 학교와 이름':'학년·반·번호와 이름'}은 선물 추첨에만 쓰고, 행사가 끝나면 지웁니다. 내가 쓴 말은 이름 없이 학교 전시와 ${grade==='staff'?'연수':'수업'} 자료에 쓰일 수 있어요.</p>
    <label class="opt" for="cAgree" style="cursor:pointer"><input type="checkbox" id="cAgree" style="width:22px;height:22px;margin:2px 0 0;flex:none"><span>위 내용을 읽었고 동의해요.${grade==='par'||grade==='staff'?'':' (보호자와 함께 확인해 주세요)'}</span></label>
    <div class="row" style="align-items:stretch">
      ${grade==='staff'
        ? `<select id="sSchool" class="field sel" aria-label="소속 학교"><option value="">소속 학교</option><option value="초등학교">초등학교</option><option value="중학교">중학교</option></select>`
        : `${gradeSelect()}
      <select id="sClass" class="field sel" aria-label="반"><option value="">반</option>${range(1,CLASS_MAX).map(n=>`<option value="${n}">${n}반</option>`).join('')}</select>
      <select id="sNum" class="field sel" aria-label="번호"><option value="">번호</option>${range(1,NUM_MAX).map(n=>`<option value="${n}">${n}번</option>`).join('')}</select>`}
      <input id="iName" class="field" placeholder="${grade==='par'?'자녀 이름':'이름'}" autocomplete="off" aria-label="이름">
    </div>
    <a class="go" id="aSend" href="#" target="_blank" rel="noopener" aria-disabled="true">${grade==='staff'?'응모하기':'선생님께 보내기'}</a>
    <p class="guide" id="sendMsg" aria-live="polite"></p>
  </section>`;
  h+=`<div class="row"><button class="go" id="bAgain" type="button">새 장면으로 한 판 더</button><button class="go ghost" id="bHome" type="button">처음 화면으로</button></div>
  <button type="button" class="infoBtn" id="bInfo2" style="align-self:flex-start">더 알아보기</button>`;
  $('#stage').innerHTML=h;
  window.scrollTo(0,0);
  bindSend(ws);
  $('#bAgain').onclick=()=>start(grade);
  $('#bHome').onclick=home;
  $('#bInfo2').onclick=()=>showInfo(()=>{$('#splash').hidden=true;});
}


const CLASS_MAX=6, NUM_MAX=40;
const range=(a,b)=>Array.from({length:b-a+1},(_,i)=>a+i);
const GRADE_OPTS={e1:['초1','초2'],e3:['초3','초4'],e5:['초5','초6'],mid:['중1','중2','중3'],
  par:['초1','초2','초3','초4','초5','초6','중1','중2','중3']};
function gradeSelect(){
  const o=(GRADE_OPTS[grade]||[]).map(v=>`<option value="${v}">${v.replace('초','초등 ').replace('중','중학교 ')}학년</option>`).join('');
  return `<select id="sGrade" class="field sel" aria-label="학년"><option value="">${grade==='par'?'자녀 학년':'학년'}</option>${o}</select>`;
}
function bindSend(ws){
  const says=ws.map(d=>`[${d.std}] ${S.write[d.id]}`).join(' / ');
  // 중학생, 중학생 자녀를 고른 양육자, 중학교 교직원 → 중학교 폼 / 그 밖 → 초등 폼
  const pickForm=()=>{
    const v=id=>{const e=$('#'+id); return e?e.value:'';};
    const isMid = grade==='mid' || (grade==='par' && v('sGrade').startsWith('중')) || (grade==='staff' && v('sSchool')==='중학교');
    return FORM[isMid ? 'mid' : 'elem'] || {base:'',ids:{}};
  };
  let F = pickForm();
  const ready=!!F.base;
  const upd=()=>{
    F = pickForm();
    const staff=grade==='staff', v=id=>{const e=$('#'+id); return e?e.value:'';};
    const a=$('#aSend'), ok=ready && $('#cAgree').checked && (staff ? v('sSchool') : (v('sGrade') && v('sClass') && v('sNum'))) && v('iName').trim();
    a.setAttribute('aria-disabled', ok?'false':'true');
    if(ok){
      const q=new URLSearchParams();
      const put=(k,v)=>{ if(F.ids[k]) q.set(F.ids[k], v); };
      put('grade',G.label); put('code',S.code); put('piece',G.piece+(S.pzSelf?'':' (정답 보기 사용)')); put('says',says||'(쓴 말 없음)');
      put('who', staff ? `교직원 ${v('sSchool')} ${v('iName').trim()}` : `${v('sGrade')} ${v('sClass')}반 ${v('sNum')}번 ${v('iName').trim()}`);
      a.href=F.base+(F.base.includes('?')?'&':'?')+'usp=pp_url&'+q.toString();
    } else a.href='#';
    $('#sendMsg').textContent = !ready ? '응모 창구를 준비하고 있어요.'
      : ok ? "열린 화면 맨 아래의 '제출' 버튼까지 꼭 눌러 주세요." : (staff ? '동의하고 소속 학교를 고른 뒤 이름을 적으면 응모할 수 있어요.' : '동의하고 학년·반·번호를 고른 뒤 이름을 적으면 보낼 수 있어요.');
  };
  ['cAgree','sGrade','sClass','sNum','sSchool','iName'].forEach(id=>{const e=$('#'+id); if(e){e.addEventListener('input',upd);e.addEventListener('change',upd);}});
  $('#cAgree').addEventListener('change',upd);
  $('#aSend').addEventListener('click',e=>{ if($('#aSend').getAttribute('aria-disabled')==='true') e.preventDefault(); });
  upd();
}

$('#bGoHome').onclick=()=>{
  const playing = S && grade && !S.done && (S.i>0 || S.phase!=='find' || S.ever);
  if(!playing){ home(); return; }
  const wasOpen=!$('#splash').hidden;
  $('#splashIn').innerHTML=`<h2 style="font-size:1.8em">처음 화면으로 갈까요?</h2>
    <p>지금까지 푼 장면과 쓴 말은 저장되지 않아요.</p>
    <div class="row" style="justify-content:center"><button class="go" id="bHomeYes" type="button">처음으로 가기</button><button class="go ghost" id="bHomeNo" type="button">계속하기</button></div>`;
  $('#splash').hidden=false;
  $('#bHomeYes').onclick=home;
  $('#bHomeNo').onclick=()=>{ $('#splash').hidden=true; if(wasOpen && S.order[S.i] && S.i<S.order.length) render(); };
  $('#bHomeNo').focus();
};
$('#bBig').onclick=()=>{const on=document.body.classList.toggle('big');$('#bBig').setAttribute('aria-pressed',on);};
$('#bRead').onclick=()=>{
  try{
    const el=$('#sent'); if(!el) return;
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(el.textContent); u.lang='ko-KR'; u.rate=.85;
    speechSynthesis.speak(u);
  }catch(e){}
};
home();
</script>
